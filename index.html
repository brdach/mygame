<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METEL: Дуэль • Gnomecore</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', 'Courier New', monospace;
            background: #0f0e12;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        #game-container {
            position: relative;
            z-index: 1;
            width: 960px;
            height: 620px;
            border: 2px solid rgba(200, 170, 120, 0.25);
            box-shadow: 0 0 80px rgba(40, 30, 20, 0.6), inset 0 0 80px rgba(20, 15, 10, 0.3);
            background: rgba(20, 18, 16, 0.85);
            display: flex;
            flex-direction: column;
            border-radius: 40px;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        #ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            border-bottom: 1px solid rgba(160, 130, 90, 0.15);
            background: rgba(16, 14, 12, 0.7);
            backdrop-filter: blur(8px);
            z-index: 5;
        }

        .player-stats {
            font-size: 1rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(230, 215, 190, 0.9);
            font-weight: 600;
            text-shadow: 0 0 20px rgba(200, 160, 100, 0.05);
        }

        .hp-bar {
            width: 140px;
            height: 10px;
            background: rgba(40, 32, 24, 0.8);
            border: 1px solid rgba(180, 150, 110, 0.2);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.25s ease;
            border-radius: 20px;
            position: relative;
        }

        .hp-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(255, 250, 220, 0.25) 0%, transparent 70%);
            border-radius: 20px;
        }

        .hp-blue { background: linear-gradient(90deg, #2d6a3d, #7ab88a); }
        .hp-red { background: linear-gradient(90deg, #7a3a2a, #d06a4a); }

        .controls-info {
            color: rgba(210, 190, 160, 0.2);
            font-size: 0.7rem;
            position: absolute;
            width: 100%;
            bottom: 16px;
            text-align: center;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0,0,0,0.9);
            font-family: 'Special Elite', cursive;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #12100e;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* ===== МЕНЮ — ТЁПЛОЕ ДЕРЕВО И МХИ ===== */
        #menu-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1f1c16;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(100, 80, 50, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(70, 100, 50, 0.1) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(120, 100, 70, 0.02) 0px, rgba(120, 100, 70, 0.02) 2px, transparent 2px, transparent 8px);
            backdrop-filter: blur(4px);
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
            animation: menuFadeIn 0.6s ease-out;
            box-shadow: inset 0 0 100px rgba(20, 10, 5, 0.7);
            border-radius: 40px;
        }
        @keyframes menuFadeIn {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }

        #menu-screen h1 {
            color: #ecd8b4;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.5), 0 0 40px rgba(200, 160, 100, 0.1);
            font-size: 4rem;
            margin-bottom: 4px;
            letter-spacing: 8px;
            font-family: 'Special Elite', cursive;
        }

        #menu-screen p {
            color: #b8a48a;
            font-size: 1.1rem;
            margin-bottom: 24px;
            text-align: center;
            font-family: 'Special Elite', cursive;
            letter-spacing: 2px;
        }

        .menu-btn {
            margin: 8px;
            width: 280px;
            padding: 16px 24px;
            border: 2px solid #8a7a5a;
            border-radius: 50px;
            font-size: 1.1rem;
            font-family: 'Special Elite', cursive;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: rgba(50, 45, 35, 0.6);
            color: #ecd8b4;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            font-weight: 600;
            position: relative;
            backdrop-filter: blur(4px);
            border-color: #7a6a4a;
        }
        .menu-btn:hover { 
            transform: scale(1.04) translateY(-3px);
            background: rgba(80, 65, 45, 0.7);
            box-shadow: 6px 6px 0px rgba(0,0,0,0.4);
            border-color: #c8a86a;
        }

        .menu-btn.back-btn {
            background: rgba(40, 35, 25, 0.6);
            border-color: #5a4a3a;
            color: #b8a48a;
        }
        .menu-btn.back-btn:hover {
            background: rgba(60, 50, 35, 0.7);
        }

        .menu-btn.store-btn {
            background: rgba(80, 70, 40, 0.3);
            border-color: #b8860b;
            color: #e6c87a;
        }
        .menu-btn.store-btn:hover {
            background: rgba(120, 90, 50, 0.4);
        }

        .menu-btn.fullscreen-btn {
            background: transparent;
            border: 2px dashed #6a5a4a;
            color: #8a7a6a;
            width: auto;
            padding: 8px 24px;
            margin-top: 16px;
            box-shadow: none;
        }
        .menu-btn.fullscreen-btn:hover {
            background: rgba(80, 70, 50, 0.15);
            border-color: #c8a86a;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .menu-btn .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: rgba(30, 25, 18, 0.95);
            border: 2px solid #8a7a5a;
            color: #ecd8b4;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 1px;
            white-space: nowrap;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
            pointer-events: none;
            font-family: 'Special Elite', cursive;
        }
        .menu-btn:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .menu-btn .bonus-badge {
            display: inline-block;
            background: rgba(200, 160, 80, 0.15);
            border: 1px solid #b89a6a;
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 0.7rem;
            color: #e6c87a;
            margin-left: 10px;
            text-transform: none;
            letter-spacing: 0.5px;
        }

        #mode-select, #difficulty-select, #map-select, #store-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        #difficulty-select, #map-select, #store-screen { display: none; }

        #promo-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 25;
            background: rgba(50, 45, 35, 0.5);
            border: 2px solid #7a6a4a;
            color: #ecd8b4;
            padding: 10px 20px;
            border-radius: 40px;
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: block;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            backdrop-filter: blur(4px);
        }
        #promo-toggle-btn:hover { 
            background: rgba(80, 65, 45, 0.7);
            transform: scale(1.03);
            border-color: #c8a86a;
        }

        #promo-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            z-index: 25;
            background: rgba(30, 25, 18, 0.95);
            border: 2px solid #8a7a5a;
            padding: 20px 24px;
            border-radius: 30px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            min-width: 240px;
            animation: panelSlideDown 0.25s ease-out;
            backdrop-filter: blur(8px);
        }
        @keyframes panelSlideDown {
            0% { opacity: 0; transform: translateY(-12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        #promo-panel label {
            color: #ecd8b4;
            font-size: 0.8rem;
            font-family: 'Special Elite', cursive;
            letter-spacing: 1px;
        }
        #promo-input {
            background: rgba(60, 55, 40, 0.5);
            border: 2px solid #6a5a4a;
            border-radius: 20px;
            padding: 10px 16px;
            color: #ecd8b4;
            font-family: 'Special Elite', cursive;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
        }
        #promo-input:focus { border-color: #c8a86a; }
        #promo-status {
            font-size: 0.8rem;
            min-height: 1.2em;
            color: #b8a48a;
            font-family: 'Special Elite', cursive;
        }
        #promo-status.success { color: #a8d08a; }
        #promo-status.error { color: #d08a6a; }
        .promo-btn {
            background: rgba(70, 60, 45, 0.5);
            border: 2px solid #7a6a4a;
            border-radius: 20px;
            padding: 8px 20px;
            color: #ecd8b4;
            font-family: 'Special Elite', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
            width: 100%;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }
        .promo-btn:hover { background: rgba(100, 80, 60, 0.6); border-color: #c8a86a; }

        #map-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            max-width: 800px;
        }
        .map-option {
            width: 100px;
            height: 80px;
            background: rgba(50, 45, 35, 0.5);
            border: 2px solid #6a5a4a;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #ecd8b4;
            font-family: 'Special Elite', cursive;
            font-size: 0.7rem;
            font-weight: 600;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
            backdrop-filter: blur(2px);
        }
        .map-option:hover {
            border-color: #c8a86a;
            transform: scale(1.05);
            background: rgba(80, 65, 45, 0.6);
        }
        .map-option.selected {
            border-color: #d4b07a;
            background: rgba(120, 90, 50, 0.5);
            color: #f0d8b0;
            box-shadow: 4px 4px 0px rgba(200, 160, 80, 0.15);
        }
        .map-option span { font-size: 2.4rem; margin-bottom: 4px; }

        #store-screen h2 {
            color: #ecd8b4;
            font-size: 2.4rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            margin-bottom: 4px;
            font-family: 'Special Elite', cursive;
        }
        #store-screen p {
            color: #b8a48a;
            font-size: 1rem;
            margin-bottom: 16px;
            font-family: 'Special Elite', cursive;
        }

        .store-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: rgba(50, 45, 35, 0.4);
            border: 2px solid #6a5a4a;
            color: #b8a48a;
            padding: 10px 24px;
            border-radius: 40px;
            font-family: 'Special Elite', cursive;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
        }
        .tab-btn:hover { 
            border-color: #c8a86a;
            background: rgba(70, 60, 45, 0.5);
        }
        .tab-btn.active {
            border-color: #d4b07a;
            color: #ecd8b4;
            background: rgba(120, 90, 50, 0.4);
        }

        .store-grid-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin: 12px 0;
            max-width: 680px;
        }
        .store-grid-container.active { display: flex; }

        .store-item {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #6a5a4a;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 0.7rem;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            position: relative;
            background: rgba(60, 50, 40, 0.4);
        }
        .store-item:hover { 
            transform: scale(1.06); 
            border-color: #c8a86a;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
        }
        .store-item.selected {
            border-color: #d4b07a;
            box-shadow: 6px 6px 0px rgba(200, 160, 80, 0.2);
        }
        .store-item .item-name {
            position: absolute;
            bottom: -22px;
            font-size: 0.6rem;
            color: #b8a48a;
            white-space: nowrap;
            font-family: 'Special Elite', cursive;
        }
        .store-item .price-tag {
            position: absolute;
            top: -6px;
            right: -6px;
            background: rgba(200, 160, 80, 0.9);
            border: 1px solid #c8a86a;
            color: #1f1c16;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.6rem;
            font-weight: bold;
            transition: opacity 0.2s ease;
        }
        .store-item .lock-icon {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 0.8rem;
            color: #d08a6a;
            transition: opacity 0.2s ease;
        }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(12, 10, 8, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
            animation: gameOverFade 0.5s ease-out;
            border-radius: 40px;
        }
        @keyframes gameOverFade {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        #game-over-screen h1 {
            color: #ecd8b4;
            text-shadow: 0 0 60px rgba(200, 160, 100, 0.15);
            font-size: 3.4rem;
            margin-bottom: 8px;
        }
        #game-over-screen p {
            color: rgba(200, 190, 170, 0.6);
            font-size: 1rem;
            margin-bottom: 28px;
        }
        button.restart-btn {
            border: none;
            border-radius: 50px;
            padding: 14px 44px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(145deg, rgba(80, 60, 40, 0.9), rgba(140, 100, 60, 0.6));
            color: #ecd8b4;
            box-shadow: 0 8px 30px rgba(80, 60, 40, 0.3);
            letter-spacing: 2px;
        }
        button.restart-btn:hover { transform: scale(1.03); }

        #pause-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(12, 10, 8, 0.7);
            backdrop-filter: blur(12px);
            z-index: 15;
            animation: pauseFade 0.2s ease-out;
            border-radius: 40px;
        }
        @keyframes pauseFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        #pause-screen h2 {
            color: #ecd8b4;
            font-size: 3.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(200, 160, 100, 0.05);
        }
        .pause-btn {
            margin: 8px;
            width: 220px;
            padding: 14px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(145deg, rgba(80, 60, 40, 0.9), rgba(140, 100, 60, 0.6));
            color: #ecd8b4;
            box-shadow: 0 8px 30px rgba(80, 60, 40, 0.2);
        }
        .pause-btn:hover { transform: scale(1.03); }
        .pause-btn.back-btn {
            background: linear-gradient(145deg, rgba(40, 35, 25, 0.8), rgba(60, 50, 40, 0.6));
        }

        #fs-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 6;
            background: rgba(20, 18, 16, 0.4);
            border: 1px solid rgba(160, 130, 90, 0.15);
            color: rgba(200, 190, 170, 0.35);
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.7rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        #fs-btn:hover {
            background: rgba(50, 45, 35, 0.3);
            border-color: rgba(200, 180, 150, 0.25);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="menu-screen">
            <button id="promo-toggle-btn" onclick="togglePromoPanel()">🍄 Промокоды</button>
            
            <div id="promo-panel">
                <label for="promo-input">Введите промокод</label>
                <input type="text" id="promo-input" placeholder="" autocomplete="off">
                <button class="promo-btn" onclick="applyPromo()">Активировать</button>
                <div id="promo-status"></div>
            </div>

            <div id="mode-select">
                <h1>METEL: Дуэль</h1>
                <p>⚔️ Выберите режим</p>
                <button class="menu-btn" onclick="selectMode(1)">1 Игрок (Против Бота)</button>
                <button class="menu-btn" onclick="selectMode(2)">2 Игрока (PvP)</button>
                <button class="menu-btn store-btn" onclick="openStore()">🛒 Магазин</button>
                <button class="menu-btn fullscreen-btn" onclick="toggleFullscreen()">🖥️ Полный экран</button>
            </div>

            <div id="difficulty-select">
                <h1 style="font-size: 2.2rem;">Уровень сложности</h1>
                <p>Наведите курсор на кнопку, чтобы увидеть награду</p>
                
                <button class="menu-btn" onclick="openMapSelect('easy')">
                    Легкий 🟢 <span class="bonus-badge">+20</span>
                    <span class="tooltip">💰 Награда: 20 монет</span>
                </button>
                
                <button class="menu-btn" onclick="openMapSelect('medium')">
                    Средний 🟡 <span class="bonus-badge">+50</span>
                    <span class="tooltip">💰 Награда: 50 монет</span>
                </button>
                
                <button class="menu-btn" onclick="openMapSelect('hard')">
                    Сложный 🔴 <span class="bonus-badge">+100</span>
                    <span class="tooltip">💰 Награда: 100 монет</span>
                </button>
                
                <button class="menu-btn" onclick="openMapSelect('impossible')">
                    Невозможный 💀 <span class="bonus-badge">+200</span>
                    <span class="tooltip">💰 Награда: 200 монет</span>
                </button>
                
                <button class="menu-btn back-btn" onclick="goBackMode()">Назад</button>
            </div>

            <div id="map-select">
                <h1 style="font-size: 1.8rem;">Выберите карту</h1>
                <p>Всего 30 карт</p>
                <div id="map-grid"></div>
                <button class="menu-btn back-btn" onclick="goBackDifficulty()">Назад</button>
            </div>

            <div id="store-screen">
                <h2>🛒 Магазин</h2>
                <p id="store-coins">Монет: 0</p>
                <div class="store-tabs">
                    <button class="tab-btn active" id="tab-skins" onclick="switchStoreTab('skins')">Скины</button>
                    <button class="tab-btn" id="tab-hats" onclick="switchStoreTab('hats')">Шляпы</button>
                    <button class="tab-btn" id="tab-weapons" onclick="switchStoreTab('weapons')">Оружие</button>
                </div>
                <div id="store-grid-skins" class="store-grid-container active"></div>
                <div id="store-grid-hats" class="store-grid-container"></div>
                <div id="store-grid-weapons" class="store-grid-container"></div>
                <button class="menu-btn back-btn" onclick="closeStore()">Назад</button>
            </div>
        </div>

        <div id="ui-header">
            <div class="player-stats" style="color: #7ab88a;">
                🌿 Лесной
                <div class="hp-bar"><div id="hp1" class="hp-fill hp-blue" style="width: 100%;"></div></div>
            </div>
            <div style="color: rgba(160, 130, 90, 0.15); font-size: 1.4rem;">⚔️</div>
            <div class="player-stats" style="color: #d06a4a;">
                <div class="hp-bar"><div id="hp2" class="hp-fill hp-red" style="width: 100%;"></div></div>
                🍂 Рыжий
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div id="game-over-screen">

    function initSnowflakes(count = 55) {
        snowflakes = [];
        for (let i = 0; i < count; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: 1.5 + Math.random() * 3.5,
                speed: 0.3 + Math.random() * 1.4,
                opacity: 0.2 + Math.random() * 0.5,
                swayOffset: Math.random() * Math.PI * 2
            });
        }
    }
    initSnowflakes(55);

    function drawSnowflakes() {
        ctx.fillStyle = 'rgba(230, 240, 250, 0.6)';
        for (let s of snowflakes) {
            ctx.globalAlpha = s.opacity;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        for (let s of snowflakes) {
            s.y += s.speed;
            s.x += Math.sin(time * 0.02 + s.swayOffset) * 0.3;
            if (s.y > canvas.height + 10) {
                s.y = -10;
                s.x = Math.random() * canvas.width;
                s.r = 1.5 + Math.random() * 3.5;
                s.speed = 0.3 + Math.random() * 1.4;
                s.opacity = 0.2 + Math.random() * 0.5;
            }
        }
        time += 1;
    }

        const code = rawCode.replace(/\s+/g, ' ').toLowerCase();
        const statusEl = promoStatus;
        if (!code) { statusEl.textContent = 'Введите код'; statusEl.className = 'error'; return; }

        if (code === 'skins 2' || code === 'skins2') {
            for (let i = 0; i < SKINS.length; i++) purchasedSkins[i] = true;
            statusEl.textContent = 'Код введен'; statusEl.className = 'success';
            if (storeScreen.style.display === 'flex') switchStoreTab('skins');
        } else if (code === 'guns 1' || code === 'guns1') {
            for (let i = 0; i < WEAPONS.length; i++) purchasedWeapons[i] = true;
            statusEl.textContent = 'Код введен'; statusEl.className = 'success';
            if (storeScreen.style.display === 'flex') switchStoreTab('weapons');
        } else if (code === 'hats 3' || code === 'hats3') {
            for (let i = 0; i < HATS.length; i++) purchasedHats[i] = true;
            statusEl.textContent = 'Код введен'; statusEl.className = 'success';
            if (storeScreen.style.display === 'flex') switchStoreTab('hats');
        } else if (code === 'bg2' || code === 'bg4') {
            doubleCoinsActive = true; doubleCoinsUntil = Date.now() + 10 * 60 * 1000;
            statusEl.textContent = 'Код введен'; statusEl.className = 'success';
        } else {
            statusEl.textContent = 'Неверный код'; statusEl.className = 'error';
        }
        promoInput.value = '';
    }

    function getCoinMultiplier() {
        if (doubleCoinsActive && Date.now() < doubleCoinsUntil) return 2;
        doubleCoinsActive = false;
        return 1;
    }

    function addParticles(x, y, color, count = 20) {
        while (particles.length > 80) particles.shift();
        for (let i = 0; i < Math.min(count, 16); i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3.5;
            particles.push({
                x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 20 + Math.random() * 30, maxLife: 50,
                size: 2 + Math.random() * 5, color, decay: 0.94
            });
        }
    }

    function switchStoreTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        storeGridSkins.classList.remove('active');
        storeGridHats.classList.remove('active');
        storeGridWeapons.classList.remove('active');
        if (tab === 'skins') { storeGridSkins.classList.add('active'); renderStoreItems(storeGridSkins, SKINS, p1SkinId, 'skin'); }
        else if (tab === 'hats') { storeGridHats.classList.add('active'); renderStoreItems(storeGridHats, HATS, p1HatId, 'hat'); }
        else if (tab === 'weapons') { storeGridWeapons.classList.add('active'); renderStoreItems(storeGridWeapons, WEAPONS, p1WeaponId, 'weapon'); }
    }

    function renderStoreItems(container, items, selectedId, type) {
        container.innerHTML = '';
        items.forEach((item, index) => {
            const div = document.createElement('div');
            const isOwned = (type === 'skin' ? purchasedSkins[index] : (type === 'hat' ? purchasedHats[index] : purchasedWeapons[index]));
            const isSelected = (index === selectedId);
            div.className = 'store-item' + (isSelected ? ' selected' : '');
            if (type === 'skin' || type === 'hat') div.style.background = `radial-gradient(circle at 35% 35%, ${item.primary}, ${item.secondary})`;
            else div.style.background = `radial-gradient(circle at 50% 50%, ${item.color} 30%, #2a2a2a 70%)`;
            const nameSpan = document.createElement('span'); nameSpan.className = 'item-name'; nameSpan.textContent = item.name; div.appendChild(nameSpan);
            
            if (index !== 0 && !isOwned) { 
                const priceTag = document.createElement('div'); priceTag.className = 'price-tag'; priceTag.textContent = '100'; div.appendChild(priceTag); 
            }
            if (!isOwned) { 
                const lock = document.createElement('div'); lock.className = 'lock-icon'; lock.textContent = '🔒'; div.appendChild(lock); 
            }
            
            div.onclick = () => {
                if (isOwned) {
                    document.querySelectorAll(`#${container.id} .store-item`).forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    if (type === 'skin') p1SkinId = index;
                    else if (type === 'hat') p1HatId = index;
                    else if (type === 'weapon') p1WeaponId = index;
                } else {
                    if (coins >= 100) {
                        coins -= 100;
                        if (type === 'skin') purchasedSkins[index] = true;
                        else if (type === 'hat') purchasedHats[index] = true;
                        else if (type === 'weapon') purchasedWeapons[index] = true;
                        updateCoinsDisplay();
                        renderStoreItems(container, items, selectedId, type);
                    } else alert('Недостаточно монет! Нужно 100 монет.');
                }
            };
            container.appendChild(div);
        });
    }

    function pointCollidesWithBlocks(px, py, size) {
        const rect = {x: px, y: py, w: size, h: size};
        for (let b of blocks) if (rect.x < b.x + b.w && rect.x + rect.w > b.x && rect.y < b.y + b.h && rect.y + rect.h > b.y) return true;
        return false;
    }

    function rectCollide(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    function resolveCollision(entity, dx, dy) {
        let testX = {x: entity.x + dx, y: entity.y, w: entity.w, h: entity.h};
        let blockedX = false;
        for (let b of blocks) if (rectCollide(testX, b)) { blockedX = true; break; }
        if (!blockedX) entity.x += dx;
        let testY = {x: entity.x, y: entity.y + dy, w: entity.w, h: entity.h};
        let blockedY = false;
        for (let b of blocks) if (rectCollide(testY, b)) { blockedY = true; break; }
        if (!blockedY) entity.y += dy;
    }

    function bulletCollidesWithBlocks(bullet) {
        for (let b of blocks) if (rectCollide(bullet, b)) return true;
        return false;
    }

    document.addEventListener('keydown', (e) => {
        if (e.key.startsWith('Arrow') || e.key === ' ' || e.key === 'Space' || e.key === '0' || e.key === 'Enter') e.preventDefault();
        keys[e.key] = true;
        if (e.key === '0' && gameMode === 2 && gameActive && !isPaused) shoot(player2, WEAPONS[p2WeaponId]);
        if (e.key === 'Escape' && gameActive) togglePause();
        if (e.key === 'z' || e.key === 'Z') {
            if (document.fullscreenElement) {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.();
            }
        }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key.startsWith('Arrow') || e.key === ' ' || e.key === 'Space' || e.key === '0' || e.key === 'Enter') e.preventDefault();
        keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && gameActive && !isPaused) { isMouseDown = true; shoot(player1, WEAPONS[p1WeaponId]); }
    });
    canvas.addEventListener('mouseup', (e) => {
        if (e.button === 0) isMouseDown = false;
    });
    canvas.addEventListener('mouseleave', () => { isMouseDown = false; });

    function togglePause() {
        if (!gameActive) return;
        isPaused = !isPaused;
        pauseScreen.style.display = isPaused ? 'flex' : 'none';
    }

    function shoot(player, weapon) {
        if (!gameActive || isPaused) return;
        const weaponFireDelay = weapon.fireRate || 1.0;
        const currentCooldown = BASE_FIRE_COOLDOWN * weaponFireDelay;
        const now = Date.now();
        if (now - player.lastShot < currentCooldown) return;

        player.lastShot = now;

        let dx, dy;
        const centerX = player.x + player.w / 2;
        const centerY = player.y + player.h / 2;

        if (player === player1) {
            let diffX = mouseX - centerX, diffY = mouseY - centerY;
            let len = Math.sqrt(diffX * diffX + diffY * diffY);
            if (len < 1) { dx = 0; dy = -1; }
            else { dx = diffX / len; dy = diffY / len; }
        } else {
            let targetX = player1.x + player1.w / 2;
            let targetY = player1.y + player1.h / 2;
            let diffX = targetX - centerX, diffY = targetY - centerY;
            let len = Math.sqrt(diffX * diffX + diffY * diffY);
            if (len < 1) { dx = 0; dy = -1; }
            else { dx = diffX / len; dy = diffY / len; }
        }

        const bulletDamage = weapon.damage || 1;
        let finalDamage = bulletDamage;
        if (player === player2 && selectedDifficulty === 'impossible') finalDamage = 5;

        const bulletColor = weapon.color || '#c8b06a';
        const bulletSize = weapon.size || 6;
        const bulletSpeedMult = weapon.speed || 1.0;
        const bulletCount = weapon.bulletCount || 1;
        const spread = weapon.spread || 0;

        addParticles(centerX + dx * (player.w/2 + 5), centerY + dy * (player.h/2 + 5), bulletColor, 10);

        for (let i = 0; i < bulletCount; i++) {
            let bulletDx = dx, bulletDy = dy;
            if (bulletCount > 1) {
                let angle = Math.atan2(dy, dx);
                let spreadAngle = angle + (Math.random() - 0.5) * spread * 2;
                bulletDx = Math.cos(spreadAngle);
                bulletDy = Math.sin(spreadAngle);
            }
            bullets.push({
                x: centerX - bulletSize / 2, y: centerY - bulletSize / 2,
                w: bulletSize, h: bulletSize,
                dx: bulletDx, dy: bulletDy,
                owner: player === player1 ? 'p1' : 'p2',
                speed: bulletSpeed * bulletSpeedMult,
                damage: finalDamage,
                color: bulletColor
            });
        }
    }

    // ===== ГНОМЬИЙ ЛЕС =====
    function drawGnomeForest() {
        // Тёплый полумрак с градиентом
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#141812');
        grad.addColorStop(0.3, '#1e2218');
        grad.addColorStop(0.6, '#2a2e1e');
        grad.addColorStop(1, '#1e1c14');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Мшистые пятна
        for (let i = 0; i < 60; i++) {
            const x = Math.random() * canvas.width;
            const y = canvas.height * 0.5 + Math.random() * canvas.height * 0.5;
            const r = 30 + Math.random() * 80;
            const grad2 = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad2.addColorStop(0, 'rgba(80, 100, 60, 0.12)');
            grad2.addColorStop(1, 'rgba(40, 60, 30, 0)');
            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        // Светящиеся грибы
        const mushroomPos = [
            {x: 40, y: 450}, {x: 120, y: 480}, {x: 200, y: 420}, {x: 300, y: 500},
            {x: 420, y: 460}, {x: 550, y: 490}, {x: 680, y: 430}, {x: 780, y: 470},
            {x: 860, y: 510}, {x: 920, y: 440}, {x: 60, y: 120}, {x: 880, y: 90}
        ];
        mushroomPos.forEach(m => {
            ctx.fillStyle = 'rgba(200, 180, 140, 0.4)';
            ctx.fillRect(m.x-3, m.y-15, 6, 20);
            ctx.fillStyle = 'rgba(200, 100, 70, 0.5)';
            ctx.beginPath();
            ctx.ellipse(m.x, m.y-15, 18, 12, 0, 0, Math.PI*2);
            ctx.fill();
            const glow = ctx.createRadialGradient(m.x, m.y-15, 2, m.x, m.y-15, 35);
            glow.addColorStop(0, 'rgba(255, 200, 150, 0.12)');
            glow.addColorStop(1, 'rgba(255, 200, 150, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(m.x, m.y-15, 35, 0, Math.PI*2);
            ctx.fill();
        });

        // Светлячки
        for (let i = 0; i < 40; i++) {
            const x = (Math.sin(i * 1.7 + time * 0.025) * 0.5 + 0.5) * canvas.width;
            const y = (Math.cos(i * 2.3 + time * 0.02) * 0.5 + 0.5) * canvas.height * 0.55 + 80;
            const r = 1.5 + Math.sin(time * 0.05 + i) * 1.2;
            const alpha = 0.25 + Math.sin(time * 0.04 + i * 1.5) * 0.2;
            ctx.fillStyle = `rgba(230, 255, 190, ${alpha})`;
            ctx.shadowColor = 'rgba(230, 255, 190, 0.3)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }

    function update(deltaTime) {
        if (!gameActive || isPaused) return;

        particles = particles.filter(p => {
            p.x += p.vx; p.y += p.vy; p.life--;
            p.vx *= p.decay; p.vy *= p.decay;
            return p.life > 0;
        });

        let dx1 = 0, dy1 = 0;
        if (keys['w'] || keys['W'] || keys['ц'] || keys['Ц']) dy1 = -1;
        if (keys['s'] || keys['S'] || keys['ы'] || keys['Ы']) dy1 = 1;
        if (keys['a'] || keys['A'] || keys['ф'] || keys['Ф']) dx1 = -1;
        if (keys['d'] || keys['D'] || keys['в'] || keys['В']) dx1 = 1;
        if (dx1 !== 0 || dy1 !== 0) {
            player1.direction = { dx: dx1, dy: dy1 };
            let len = Math.sqrt(dx1*dx1 + dy1*dy1);
            let speedX = (dx1 / len) * playerSpeed;
            let speedY = (dy1 / len) * playerSpeed;
            resolveCollision(player1, speedX, speedY);
        }

        if (gameMode === 2) {
            let dx2 = 0, dy2 = 0;
            if (keys['ArrowUp']) dy2 = -1;
            if (keys['ArrowDown']) dy2 = 1;
            if (keys['ArrowLeft']) dx2 = -1;
            if (keys['ArrowRight']) dx2 = 1;
            if (dx2 !== 0 || dy2 !== 0) {
                player2.direction = { dx: dx2, dy: dy2 };
                let len = Math.sqrt(dx2*dx2 + dy2*dy2);
                let speedX = (dx2 / len) * playerSpeed;
                let speedY = (dy2 / len) * playerSpeed;
                resolveCollision(player2, speedX, speedY);
            }
        } else {
            const targetX = player1.x + player1.w / 2;
            const targetY = player1.y + player1.h / 2;
            const botCX = player2.x + player2.w / 2, botCY = player2.y + player2.h / 2;
            const dx = targetX - botCX, dy = targetY - botCY;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 1) {
                const normX = dx / dist, normY = dy / dist;
                let moveX = normX, moveY = normY;

                if (Math.random() < 0.12) {
                    let angle = Math.atan2(normY, normX) + (Math.random() - 0.5) * 0.7;
                    moveX = Math.cos(angle);
                    moveY = Math.sin(angle);
                }

                if (dist > 120) {
                    let speedX = moveX * playerSpeed * botSpeedModifier;
                    let speedY = moveY * playerSpeed * botSpeedModifier;
                    resolveCollision(player2, speedX, speedY);
                    player2.direction = { dx: moveX, dy: moveY };
                } else if (dist > 40) {
                    let perpX = -moveY, perpY = moveX;
                    let speedX = perpX * playerSpeed * botSpeedModifier * 0.5;
                    let speedY = perpY * playerSpeed * botSpeedModifier * 0.5;
                    resolveCollision(player2, speedX, speedY);
                    player2.direction = { dx: moveX, dy: moveY };
                }

                if (dist < 450 && dist > 40 && (Date.now() - player2.lastShot > botFireCooldown + Math.random() * 200)) {
                    shoot(player2, WEAPONS[p2WeaponId]);
                }
            }
        }

        player1.x = Math.max(0, Math.min(canvas.width - player1.w, player1.x));
        player1.y = Math.max(0, Math.min(canvas.height - player1.h, player1.y));
        player2.x = Math.max(0, Math.min(canvas.width - player2.w, player2.x));
        player2.y = Math.max(0, Math.min(canvas.height - player2.h, player2.y));

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.dx * b.speed;
            b.y += b.dy * b.speed;
            if (b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) { bullets.splice(i, 1); continue; }
            if (bulletCollidesWithBlocks(b)) { bullets.splice(i, 1); continue; }
            let hit = false;
            if (b.owner === 'p2' && rectCollide(b, player1)) {
                player1.hp -= b.damage;
                player1.lastDamageTime = Date.now();
                player1.regenActive = false;
                hit = true;
                addParticles(b.x + b.w/2, b.y + b.h/2, '#d06a4a', 18);
                updateUI();
                if (player1.hp <= 0) { endGame('🍂 Рыжий победил!'); return; }
            }
            if (b.owner === 'p1' && rectCollide(b, player2)) {
                player2.hp -= b.damage;
                player2.lastDamageTime = Date.now();
                player2.regenActive = false;
                hit = true;
                addParticles(b.x + b.w/2, b.y + b.h/2, '#7ab88a', 18);
                updateUI();
                if (player2.hp <= 0) { endGame('🌿 Лесной победил!'); return; }
            }
            if (hit) bullets.splice(i, 1);
        }

        const regenDelay = 5000;
        const regenInterval = 2000;
        const regenPercent = 0.1;
        [player1, player2].forEach(p => {
            if (p.hp > 0 && p.hp < p.maxHp) {
                if (!p.regenActive && Date.now() - p.lastDamageTime > regenDelay) {
                    p.regenActive = true;
                    p.lastRegenTime = Date.now();
                }
                if (p.regenActive && Date.now() - p.lastRegenTime >= regenInterval) {
                    p.hp = Math.min(p.maxHp, p.hp + p.maxHp * regenPercent);
                    p.lastRegenTime = Date.now();
                    updateUI();
                    if (p.hp >= p.maxHp) p.regenActive = false;
                }
            } else p.regenActive = false;
        });

        if (isMouseDown && gameActive && !isPaused) {
            const now = Date.now();
            const weapon = WEAPONS[p1WeaponId];
            const weaponFireDelay = weapon.fireRate || 1.0;
            const currentCooldown = BASE_FIRE_COOLDOWN * weaponFireDelay;
            if (now - player1.lastShot >= currentCooldown) shoot(player1, weapon);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGnomeForest();
        drawSnowflakes();

        // Блоки с эффектом свечения
        blocks.forEach(b => { 
            const grad = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
            grad.addColorStop(0, 'rgba(70, 60, 45, 0.9)');
            grad.addColorStop(1, 'rgba(45, 40, 30, 0.9)');
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(100, 80, 50, 0.25)';
            ctx.shadowBlur = 20;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = 'rgba(180, 150, 110, 0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            
            ctx.strokeStyle = 'rgba(220, 200, 160, 0.06)';
            ctx.lineWidth = 1;
            ctx.strokeRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
        });

        // Прицел
        if (player1.x !== undefined && mouseX !== undefined) {
            const cx = player1.x + player1.w / 2;
            const cy = player1.y + player1.h / 2;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(mouseX, mouseY);
            
            ctx.strokeStyle = 'rgba(240, 230, 210, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 10]);
            ctx.shadowColor = 'rgba(240, 230, 210, 0.05)';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
        }

        particles.forEach(p => {
            const alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        bullets.forEach(b => {
            ctx.fillStyle = b.color || '#c8b06a';
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.shadowBlur = 0;

        drawPlayer(ctx, player1, SKINS[p1SkinId], true, p1HatId, WEAPONS[p1WeaponId]);
        drawPlayer(ctx, player2, SKINS[p2SkinId], false, 0, WEAPONS[p2WeaponId]);
    }

    // ===== НОВЫЕ ПЕРСОНАЖИ =====
    function drawPlayer(ctx, player, skin, isP1, hatId, weapon) {
        const x = player.x + player.w / 2;
        const y = player.y + player.h / 2;
        const r = player.w / 2;

        // Тень
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 5;

        // Тело (овал)
        const grad = ctx.createRadialGradient(x - 5, y - 8, 2, x, y + 4, r * 1.2);
        grad.addColorStop(0, lightenColor(skin.primary, 60));
        grad.addColorStop(0.6, skin.primary);
        grad.addColorStop(1, skin.secondary);
        ctx.beginPath();
        ctx.ellipse(x, y + 2, r * 1.1, r * 1.25, 0, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = skin.secondary;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // "Животик" (светлое пятно)
        ctx.beginPath();
        ctx.ellipse(x, y + 6, r * 0.5, r * 0.6, 0, 0, Math.PI * 2);
        ctx.fillStyle = lightenColor(skin.primary, 80);
        ctx.globalAlpha = 0.4;
        ctx.fill();
        ctx.globalAlpha = 1;

        // Глаза с бровями (выражение)
        let dirX = player.direction.dx;
        let dirY = player.direction.dy;
        if (isP1) {
            let dX = mouseX - x, dY = mouseY - y;
            let len = Math.sqrt(dX*dX + dY*dY);
            if (len > 1) { dirX = dX / len; dirY = dY / len; }
            else if (len === 0) { dirX = 0; dirY = -1; }
        } else {
            if (dirX === 0 && dirY === 0) { dirX = 0; dirY = -1; }
        }

        let eyeOffX = dirX * 5, eyeOffY = dirY * 4;
        let perpX = -dirY, perpY = dirX;

        function drawEye(ox, oy) {
            let ex = x + eyeOffX + ox, ey = y + eyeOffY + oy + 2;
            // Белок
            ctx.shadowColor = 'rgba(255, 240, 210, 0.15)';
            ctx.shadowBlur = 10;
            ctx.beginPath(); 
            ctx.ellipse(ex, ey, 6, 7, 0, 0, Math.PI * 2); 
            ctx.fillStyle = '#f5efe0'; 
            ctx.fill();
            ctx.shadowBlur = 0;
            // Радужка
            ctx.beginPath(); 
            ctx.arc(ex + dirX*2.5, ey + dirY*2.5, 3.8, 0, Math.PI * 2); 
            ctx.fillStyle = skin.eye; 
            ctx.fill();
            // Зрачок
            ctx.beginPath(); 
            ctx.arc(ex + dirX*3.8, ey + dirY*3.8, 2.2, 0, Math.PI * 2); 
            ctx.fillStyle = skin.pupil; 
            ctx.fill();
            // Блик
            ctx.beginPath(); 
            ctx.arc(ex + dirX*1.5 - 1.5, ey + dirY*1.5 - 2, 1.2, 0, Math.PI * 2); 
            ctx.fillStyle = 'rgba(255,255,240,0.7)'; 
            ctx.fill();
        }
        drawEye(perpX * 6, perpY * 5);
        drawEye(-perpX * 6, -perpY * 5);

        // Рот (улыбка или серьёзность)
        ctx.beginPath();
        ctx.arc(x + dirX*3, y + dirY*6 + 8, 4, 0.1, Math.PI - 0.1);
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Уши
        ctx.fillStyle = skin.secondary;
        ctx.beginPath();
        ctx.ellipse(x - r * 0.8, y - 2, 4, 7, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + r * 0.8, y - 2, 4, 7, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // Шляпа
        if (isP1 && hatId !== undefined && HATS[hatId] && HATS[hatId].name !== 'Без шляпы') {
            const hat = HATS[hatId];
            const hatY = y - r - 2;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 15;
            ctx.fillStyle = hat.primary;
            ctx.strokeStyle = hat.secondary;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 16, hatY + 2);
            ctx.quadraticCurveTo(x - 20, hatY - 6, x, hatY - 22);
            ctx.quadraticCurveTo(x + 20, hatY - 6, x + 16, hatY + 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = hat.secondary;
            ctx.fillRect(x - 18, hatY + 1, 36, 4);
            ctx.shadowBlur = 0;
        }

        // Оружие (в руке)
        if (weapon) {
            const weaponX = x + dirX * (r + 6);
            const weaponY = y + dirY * (r + 4);
            ctx.shadowColor = weapon.color;
            ctx.shadowBlur = 20;
            // "Рука"
            ctx.beginPath();
            ctx.moveTo(x + dirX * (r - 2), y + dirY * (r - 2) + 2);
            ctx.lineTo(weaponX - dirX * 4, weaponY - dirY * 4);
            ctx.strokeStyle = skin.secondary;
            ctx.lineWidth = 5;
            ctx.stroke();
            // Оружие
            ctx.beginPath();
            ctx.moveTo(weaponX - dirX * 4, weaponY - dirY * 4);
            ctx.lineTo(weaponX, weaponY);
            ctx.strokeStyle = weapon.color;
            ctx.lineWidth = 5;
            ctx.stroke();
            // Наконечник
            ctx.beginPath();
            ctx.arc(weaponX, weaponY, 4, 0, Math.PI * 2);
            ctx.fillStyle = weapon.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Ножки (милые короткие)
        ctx.strokeStyle = skin.secondary;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x - 6, y + r * 1.1);
        ctx.lineTo(x - 10, y + r * 1.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 6, y + r * 1.1);
        ctx.lineTo(x + 10, y + r * 1.5);
        ctx.stroke();

        // Лёгкое свечение вокруг персонажа
        ctx.shadowColor = skin.primary;
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(x, y, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    function lightenColor(hex, percent) {
        const num = parseInt(hex.replace('#', ''), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.min(255, (num >> 16) + amt);
        const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
        const B = Math.min(255, (num & 0x0000FF) + amt);
        return `rgb(${R},${G},${B})`;
    }

    function updateUI() {
        hp1Bar.style.width = (player1.hp / player1.maxHp * 100) + '%';
        hp2Bar.style.width = (player2.hp / player2.maxHp * 100) + '%';
    }

    function endGame(winnerMessage) {
        gameActive = false;
        isPaused = false;
        pauseScreen.style.display = 'none';
        winnerText.textContent = winnerMessage;
        winnerSubtext.textContent = "в лесу всегда остается один....";
        gameOverScreen.style.display = 'flex';
        if (gameMode === 1 && player2.hp <= 0) {
            let reward = 0;
            switch(selectedDifficulty) {
                case 'easy': reward = 20; break;
                case 'medium': reward = 50; break;
                case 'hard': reward = 100; break;
                case 'impossible': reward = 200; break;
            }
            const mult = getCoinMultiplier();
            coins += reward * mult;
            updateCoinsDisplay();
        }
    }

    function resetGameState() {
        blocks = MAPS[selectedMap].blocks.map(b => ({...b}));
        player1.hp = MAX_HP; player1.maxHp = MAX_HP; player1.lastDamageTime = Date.now(); player1.regenActive = false; player1.lastRegenTime = 0;
        if (gameMode === 1) { player2.hp = botHP; player2.maxHp = botHP; } else { player2.hp = MAX_HP; player2.maxHp = MAX_HP; }
        player2.lastDamageTime = Date.now(); player2.regenActive = false; player2.lastRegenTime = 0;
        player1.color = SKINS[p1SkinId].primary;
        p2SkinId = Math.floor(Math.random() * SKINS.length);
        while (p2SkinId === p1SkinId && SKINS.length > 1) p2SkinId = Math.floor(Math.random() * SKINS.length);
        player2.color = SKINS[p2SkinId].primary;
        p2WeaponId = Math.floor(Math.random() * WEAPONS.length);

        let startX1 = 100, startY1 = 250;
        let startX2 = 770, startY2 = 250;
        while (pointCollidesWithBlocks(startX1, startY1, PLAYER_SIZE)) { startX1 += 10; if (startX1 > canvas.width - PLAYER_SIZE) startX1 = 10; }
        while (pointCollidesWithBlocks(startX2, startY2, PLAYER_SIZE)) { startX2 -= 10; if (startX2 < 0) startX2 = canvas.width - PLAYER_SIZE - 10; }
        player1.x = startX1; player1.y = startY1;
        player2.x = startX2; player2.y = startY2;
        player1.direction = { dx: 0, dy: -1 };
        player2.direction = { dx: 0, dy: -1 };
        player1.lastShot = 0; player2.lastShot = 0;
        bullets = []; particles = [];
        gameActive = true;
        isPaused = false;
        pauseScreen.style.display = 'none';
        updateUI();
    }

    function launchGame() {
        gameActive = false;
        isPaused = false;
        pauseScreen.style.display = 'none';
        bullets = []; particles = [];
        menuScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        applyDifficulty(selectedDifficulty);
        if (gameMode === 1) uiHint.textContent = "Наведи мышь и стреляй ЛКМ!";
        else uiHint.textContent = "Синий: ЛКМ по курсору. Красный: 0.";
        resetGameState();
        setTimeout(() => { gameActive = true; }, 100);
        accumulator = 0;
        lastTimestamp = performance.now();
    }

    function applyDifficulty(difficulty) {
        if (difficulty === 'easy') { bulletSpeed = 10; botSpeedModifier = 0.6; botFireCooldown = 200; botHP = 60; }
        else if (difficulty === 'medium') { bulletSpeed = 12; botSpeedModifier = 0.8; botFireCooldown = 160; botHP = 80; }
        else if (difficulty === 'hard') { bulletSpeed = 16; botSpeedModifier = 0.9; botFireCooldown = 120; botHP = 100; }
        else if (difficulty === 'impossible') { bulletSpeed = 20; botSpeedModifier = 1.0; botFireCooldown = 80; botHP = 150; }
    }

    function backToMenu() {
        gameActive = false;
        isPaused = false;
        pauseScreen.style.display = 'none';
        gameMode = null;
        selectedDifficulty = 'medium';
        selectedMap = 0;
        botHP = 40;
        botSpeedModifier = 0.85;
        botFireCooldown = 150;
        player1.hp = MAX_HP; player2.hp = MAX_HP;
        player1.x = 100; player1.y = 250;
        player2.x = 770; player2.y = 250;
        player1.direction = { dx: 0, dy: -1 };
        player2.direction = { dx: 0, dy: -1 };
        updateUI();
        gameOverScreen.style.display = 'none';
        menuScreen.style.display = 'flex';
        modeSelect.style.display = 'flex';
        difficultySelect.style.display = 'none';
        mapSelect.style.display = 'none';
        storeScreen.style.display = 'none';
        accumulator = 0;
        lastTimestamp = performance.now();
        promoToggleBtn.style.display = 'block';
        promoPanel.style.display = 'none';
        promoStatus.textContent = '';
        promoStatus.className = '';
    }

    function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = timestamp - lastTimestamp;
        lastTimestamp = timestamp;

        if (gameActive && !isPaused) {
            accumulator += delta;
            while (accumulator >= STEP) {
                update(STEP);
                accumulator -= STEP;
                if (!gameActive) break;
            }
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
