<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METEL: Дуэль</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Special Elite', 'Courier New', monospace;
            background: #0b1a30;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* Снежинки – задний фон */
        #snowflakes-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            opacity: 0.6;
            animation: fall linear infinite;
            user-select: none;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.3);
        }
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg) scale(1); }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.5); }
        }

        #game-container {
            position: relative;
            z-index: 1;
            width: 900px;
            height: 600px;
            border: 1px solid rgba(65, 105, 225, 0.3);
            box-shadow: 0 0 60px rgba(65, 105, 225, 0.2), inset 0 0 60px rgba(0,0,0,0.3);
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            overflow: hidden;
        }

        #ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(65, 105, 225, 0.2);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }

        .player-stats {
            font-size: 1.1rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 20px rgba(65, 105, 225, 0.3);
        }

        .hp-bar {
            width: 140px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.15s ease;
            border-radius: 4px;
        }

        .hp-blue { background: linear-gradient(90deg, #1e3a8a, #4169E1); box-shadow: 0 0 15px rgba(65, 105, 225, 0.5); }
        .hp-red { background: linear-gradient(90deg, #7f1d1d, #b31b1b); box-shadow: 0 0 15px rgba(179, 27, 27, 0.5); }

        .controls-info {
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
            position: absolute;
            width: 100%;
            bottom: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* МЕНЮ — СТЕКЛЯННЫЙ СТИЛЬ */
        #menu-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(12px);
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
        }

        #menu-screen h1 {
            color: #ff6b6b;
            text-shadow: 0 0 40px rgba(255, 107, 107, 0.6), 0 0 80px rgba(255, 107, 107, 0.3);
            font-size: 3.8rem;
            margin-bottom: 6px;
            letter-spacing: 6px;
        }

        #menu-screen p {
            color: rgba(194, 183, 169, 0.8);
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .menu-btn {
            margin: 6px;
            width: 260px;
            padding: 14px 20px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, rgba(179, 27, 27, 0.8), rgba(255, 107, 107, 0.6));
            color: #fff;
            box-shadow: 0 4px 25px rgba(179, 27, 27, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 35px rgba(179, 27, 27, 0.5);
            background: linear-gradient(135deg, rgba(179, 27, 27, 1), rgba(255, 107, 107, 0.8));
        }

        .menu-btn.back-btn {
            background: linear-gradient(135deg, rgba(74, 63, 54, 0.8), rgba(122, 111, 102, 0.6));
            box-shadow: 0 4px 25px rgba(74, 63, 54, 0.3);
        }

        .menu-btn.back-btn:hover {
            box-shadow: 0 6px 35px rgba(74, 63, 54, 0.5);
        }

        .menu-btn.store-btn {
            background: linear-gradient(135deg, rgba(247, 151, 30, 0.8), rgba(255, 210, 0, 0.6));
            box-shadow: 0 4px 25px rgba(247, 151, 30, 0.3);
            color: #000;
        }

        .menu-btn.store-btn:hover {
            box-shadow: 0 6px 35px rgba(247, 151, 30, 0.5);
        }

        .menu-btn.fullscreen-btn {
            background: transparent;
            border: 1px solid rgba(74, 63, 54, 0.5);
            color: rgba(184, 169, 148, 0.8);
            width: auto;
            padding: 6px 18px;
            margin-top: 16px;
        }
        .menu-btn.fullscreen-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(184, 169, 148, 0.8);
        }

        #mode-select, #difficulty-select, #map-select, #store-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        #difficulty-select, #map-select, #store-screen { display: none; }

        /* Кнопка промокодов — неоновая синяя */
        #promo-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 25;
            background: rgba(30, 58, 138, 0.7);
            border: 1px solid rgba(65, 105, 225, 0.5);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(30, 58, 138, 0.3);
            backdrop-filter: blur(8px);
            letter-spacing: 1px;
            display: block;
        }
        #promo-toggle-btn:hover {
            background: rgba(37, 99, 235, 0.8);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.5);
            border-color: rgba(65, 105, 225, 0.8);
        }

        /* Панель промокодов — стеклянная */
        #promo-panel {
            position: absolute;
            top: 75px;
            left: 20px;
            z-index: 25;
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(16px);
            padding: 16px 22px;
            border-radius: 16px;
            border: 1px solid rgba(65, 105, 225, 0.3);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            min-width: 240px;
        }
        #promo-panel label {
            color: rgba(194, 183, 169, 0.9);
            font-size: 0.85rem;
            font-family: inherit;
            letter-spacing: 1px;
        }
        #promo-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(65, 105, 225, 0.3);
            border-radius: 10px;
            padding: 8px 14px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }
        #promo-input:focus {
            border-color: rgba(65, 105, 225, 0.8);
            box-shadow: 0 0 20px rgba(65, 105, 225, 0.2);
        }
        #promo-status {
            font-size: 0.85rem;
            min-height: 1.2em;
            color: rgba(74, 63, 54, 0.8);
            transition: all 0.3s ease;
        }
        #promo-status.success {
            color: #2ecc71;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }
        #promo-status.error {
            color: #e74c3c;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
        }
        .promo-btn {
            background: rgba(30, 58, 138, 0.7);
            border: 1px solid rgba(65, 105, 225, 0.3);
            border-radius: 10px;
            padding: 6px 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2px;
            width: 100%;
        }
        .promo-btn:hover {
            background: rgba(37, 99, 235, 0.8);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
        }

        /* Карты */
        #map-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            max-width: 800px;
        }
        .map-option {
            width: 110px;
            height: 90px;
            background: rgba(26, 22, 18, 0.6);
            border: 1px solid rgba(74, 63, 54, 0.5);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(184, 169, 148, 0.8);
            font-family: inherit;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
        }
        .map-option:hover {
            border-color: rgba(184, 169, 148, 0.8);
            transform: scale(1.05);
            background: rgba(26, 22, 18, 0.8);
        }
        .map-option.selected {
            border-color: rgba(179, 27, 27, 0.8);
            box-shadow: 0 0 30px rgba(179, 27, 27, 0.3);
            background: rgba(26, 22, 18, 0.9);
        }
        .map-option span {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        /* Магазин */
        #store-screen h2 {
            color: #ffd700;
            font-size: 2.2rem;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            margin-bottom: 6px;
        }
        #store-screen p {
            color: rgba(194, 183, 169, 0.8);
            font-size: 1.1rem;
            margin-bottom: 16px;
        }

        .store-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(74, 63, 54, 0.5);
            color: rgba(184, 169, 148, 0.8);
            padding: 8px 22px;
            border-radius: 25px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .tab-btn:hover {
            border-color: rgba(184, 169, 148, 0.8);
            color: #fff;
        }
        .tab-btn.active {
            border-color: rgba(255, 215, 0, 0.6);
            color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
            background: rgba(255, 215, 0, 0.05);
        }

        .store-grid-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 16px 0;
            max-width: 700px;
        }
        .store-grid-container.active {
            display: flex;
        }

        .store-item {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(74, 63, 54, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 0.75rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            position: relative;
            backdrop-filter: blur(4px);
        }
        .store-item:hover {
            transform: scale(1.1);
            border-color: rgba(184, 169, 148, 0.8);
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }
        .store-item.selected {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .store-item .item-name {
            position: absolute;
            bottom: -22px;
            font-size: 0.65rem;
            color: rgba(194, 183, 169, 0.7);
            white-space: nowrap;
        }
        .store-item .price-tag {
            position: absolute;
            top: -4px;
            right: -4px;
            background: rgba(255, 215, 0, 0.9);
            color: #000;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.65rem;
            font-weight: bold;
            border: 1px solid rgba(184, 139, 11, 0.5);
        }
        .store-item .lock-icon {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 0.7rem;
            color: rgba(255, 85, 85, 0.9);
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.3);
        }
        .store-item .weapon-tooltip {
            display: none;
            position: absolute;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.65rem;
            white-space: nowrap;
            border: 1px solid rgba(74, 63, 54, 0.5);
            pointer-events: none;
            z-index: 10;
        }
        .store-item:hover .weapon-tooltip {
            display: block;
        }

        /* Экран окончания */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        #game-over-screen h1 {
            color: #b31b1b;
            text-shadow: 0 0 40px rgba(179, 27, 27, 0.5);
            font-size: 3rem;
            margin-bottom: 8px;
        }
        #game-over-screen p {
            color: rgba(194, 183, 169, 0.8);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        button.restart-btn {
            border: none;
            border-radius: 30px;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, rgba(179, 27, 27, 0.8), rgba(255, 107, 107, 0.6));
            color: #fff;
            box-shadow: 0 4px 25px rgba(179, 27, 27, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        button.restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 35px rgba(179, 27, 27, 0.5);
        }

        /* Экран паузы */
        #pause-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 15;
        }
        #pause-screen h2 {
            color: #ffd700;
            font-size: 3rem;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            margin-bottom: 16px;
        }
        .pause-btn {
            margin: 6px;
            width: 200px;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, rgba(179, 27, 27, 0.8), rgba(255, 107, 107, 0.6));
            color: #fff;
            box-shadow: 0 4px 25px rgba(179, 27, 27, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .pause-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 35px rgba(179, 27, 27, 0.5);
        }
        .pause-btn.back-btn {
            background: linear-gradient(135deg, rgba(74, 63, 54, 0.8), rgba(122, 111, 102, 0.6));
            box-shadow: 0 4px 25px rgba(74, 63, 54, 0.3);
        }
        .pause-btn.back-btn:hover {
            box-shadow: 0 6px 35px rgba(74, 63, 54, 0.5);
        }

        /* Кнопка полноэкранного режима в игре */
        #fs-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 6;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(74, 63, 54, 0.5);
            color: rgba(184, 169, 148, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }
        #fs-btn:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(184, 169, 148, 0.8);
        }

        .explosion {
            position: absolute;
            pointer-events: none;
            animation: explode 0.5s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="snowflakes-wrapper"></div>

    <div id="game-container">
        <div id="menu-screen">
            <!-- Синяя кнопка промокодов -->
            <button id="promo-toggle-btn" onclick="togglePromoPanel()">🎫 Промокоды</button>
            
            <!-- Панель промокодов (изначально скрыта) -->
            <div id="promo-panel">
                <label for="promo-input">Введите промокод</label>
                <input type="text" id="promo-input" placeholder="" autocomplete="off">
                <button class="promo-btn" onclick="applyPromo()">Активировать</button>
                <div id="promo-status"></div>
            </div>

            <div id="mode-select">
                <h1>METEL: Дуэль</h1>
                <p>⚔️ Выберите режим</p>
                <button class="menu-btn" onclick="selectMode(1)">1 Игрок (Против Бота)</button>
                <button class="menu-btn" onclick="selectMode(2)">2 Игрока (PvP)</button>
                <button class="menu-btn store-btn" onclick="openStore()">🛒 Магазин</button>
                <button class="menu-btn fullscreen-btn" onclick="toggleFullscreen()">🖥️ Полный экран</button>
            </div>

            <div id="difficulty-select">
                <h1 style="font-size: 2.2rem;">Уровень сложности</h1>
                <p>Влияет на скорость боя и реакцию противника</p>
                <button class="menu-btn" onclick="openMapSelect('easy')">Легкий 🟢</button>
                <button class="menu-btn" onclick="openMapSelect('medium')">Средний 🟡</button>
                <button class="menu-btn" onclick="openMapSelect('hard')">Сложный 🔴</button>
                <button class="menu-btn" onclick="openMapSelect('impossible')">Невозможный 💀</button>
                <button class="menu-btn back-btn" onclick="goBackMode()">Назад</button>
            </div>

            <div id="map-select">
                <h1 style="font-size: 1.8rem;">Выберите карту</h1>
                <p>Всего 30 карт</p>
                <div id="map-grid"></div>
                <button class="menu-btn back-btn" onclick="goBackDifficulty()">Назад</button>
            </div>

            <div id="store-screen">
                <h2>🛒 Магазин</h2>
                <p id="store-coins">Монет: 0</p>
                <div class="store-tabs">
                    <button class="tab-btn active" id="tab-skins" onclick="switchStoreTab('skins')">Скины</button>
                    <button class="tab-btn" id="tab-hats" onclick="switchStoreTab('hats')">Шляпы</button>
                    <button class="tab-btn" id="tab-weapons" onclick="switchStoreTab('weapons')">Оружие</button>
                </div>
                <div id="store-grid-skins" class="store-grid-container active"></div>
                <div id="store-grid-hats" class="store-grid-container"></div>
                <div id="store-grid-weapons" class="store-grid-container"></div>
                <button class="menu-btn back-btn" onclick="closeStore()">Назад</button>
            </div>
        </div>

        <div id="ui-header">
            <div class="player-stats" style="color: rgba(65, 105, 225, 0.9);">
                Синий (WASD)
                <div class="hp-bar"><div id="hp1" class="hp-fill hp-blue" style="width: 100%;"></div></div>
            </div>
            <div style="color: rgba(74, 63, 54, 0.8); font-size: 1.2rem;">⚔️</div>
            <div class="player-stats" style="color: rgba(179, 27, 27, 0.9);">
                <div class="hp-bar"><div id="hp2" class="hp-fill hp-red" style="width: 100%;"></div></div>
                Красный (Стрелки)
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="gameCanvas" width="900" height="530"></canvas>
            <div id="game-over-screen">
                <h1 id="winner-text">Игрок Синий победил!</h1>
                <p id="winner-subtext">В метели выживает сильнейший.</p>
                <button class="restart-btn" onclick="backToMenu()">Вернуться в меню</button>
            </div>
            <div id="pause-screen">
                <h2>⏸️ Пауза</h2>
                <button class="pause-btn" onclick="togglePause()">Продолжить</button>
                <button class="pause-btn back-btn" onclick="backToMenu()">В меню</button>

    function togglePromoPanel() {
        const isVisible = promoPanel.style.display === 'flex';
        promoPanel.style.display = isVisible ? 'none' : 'flex';
        if (!isVisible) {
            promoStatus.textContent = '';
            promoStatus.className = '';
            promoInput.value = '';
        }
    }

    function applyPromo() {
        const rawCode = promoInput.value.trim();
        const code = rawCode.replace(/\s+/g, ' ').toLowerCase();
        const statusEl = promoStatus;
        if (!code) {
            statusEl.textContent = 'Введите код';
            statusEl.className = 'error';
            return;
        }

        if (code === 'skins 2' || code === 'skins2') {
            for (let i = 0; i < SKINS.length; i++) purchasedSkins[i] = true;
            statusEl.textContent = 'Код введен';
            statusEl.className = 'success';
            if (storeScreen.style.display === 'flex') switchStoreTab('skins');
        } else if (code === 'guns 1' || code === 'guns1') {
            for (let i = 0; i < WEAPONS.length; i++) purchasedWeapons[i] = true;
            statusEl.textContent = 'Код введен';
            statusEl.className = 'success';
            if (storeScreen.style.display === 'flex') switchStoreTab('weapons');
        } else if (code === 'hats 3' || code === 'hats3') {
            for (let i = 0; i < HATS.length; i++) purchasedHats[i] = true;
            statusEl.textContent = 'Код введен';
            statusEl.className = 'success';
            if (storeScreen.style.display === 'flex') switchStoreTab('hats');
        } else if (code === 'bg2' || code === 'bg4') {
            doubleCoinsActive = true;
            doubleCoinsUntil = Date.now() + 10 * 60 * 1000;
            statusEl.textContent = 'Код введен';
            statusEl.className = 'success';
        } else {
            statusEl.textContent = 'Неверный код';
            statusEl.className = 'error';
        }
        promoInput.value = '';
    }

        if (doubleCoinsActive && Date.now() < doubleCoinsUntil) {
            return 2;
        }
        doubleCoinsActive = false;
        return 1;
    }

    function addParticles(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            particles.push({
                x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                life: 20 + Math.random() * 20, maxLife: 40,
                size: 2 + Math.random() * 4, color, decay: 0.95
            });
        }
    }

    function renderStoreItems(container, items, selectedId, type) {
        container.innerHTML = '';
        items.forEach((item, index) => {
            const div = document.createElement('div');
            const isOwned = (type === 'skin' ? purchasedSkins[index] : (type === 'hat' ? purchasedHats[index] : purchasedWeapons[index]));
            const isSelected = (index === selectedId);
            div.className = 'store-item' + (isSelected ? ' selected' : '');
            if (type === 'skin' || type === 'hat') div.style.background = `radial-gradient(circle at 35% 35%, ${item.primary}, ${item.secondary})`;
            else div.style.background = `radial-gradient(circle at 50% 50%, ${item.color} 30%, #111 70%)`;
            const nameSpan = document.createElement('span'); nameSpan.className = 'item-name'; nameSpan.textContent = item.name; div.appendChild(nameSpan);
            if (index !== 0) { const priceTag = document.createElement('div'); priceTag.className = 'price-tag'; priceTag.textContent = '100'; div.appendChild(priceTag); }
            if (!isOwned) { const lock = document.createElement('div'); lock.className = 'lock-icon'; lock.textContent = '🔒'; div.appendChild(lock); }
            if (type === 'weapon') { const tooltip = document.createElement('div'); tooltip.className = 'weapon-tooltip'; tooltip.textContent = `Урон: ${item.damage} | Скорость: ${item.speed}x | Перезарядка: ${item.fireRate}x`; div.appendChild(tooltip); }
            div.onclick = () => {
                if (isOwned) {
                    document.querySelectorAll(`#${container.id} .store-item`).forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    if (type === 'skin') p1SkinId = index;
                    else if (type === 'hat') p1HatId = index;
                    else if (type === 'weapon') p1WeaponId = index;
                } else {
                    if (coins >= 100) {
                        coins -= 100;
                        if (type === 'skin') purchasedSkins[index] = true;
                        else if (type === 'hat') purchasedHats[index] = true;
                        else if (type === 'weapon') purchasedWeapons[index] = true;
                        updateCoinsDisplay();
                        renderStoreItems(container, items, selectedId, type);
                    } else alert('Недостаточно монет! Нужно 100 монет.');
                }
            };
            container.appendChild(div);
        });
    }

    function pointCollidesWithBlocks(px, py, size) {
        const rect = {x: px, y: py, w: size, h: size};
        for (let b of blocks) if (rect.x < b.x + b.w && rect.x + rect.w > b.x && rect.y < b.y + b.h && rect.y + rect.h > b.y) return true;
        return false;
    }

    function rectCollide(r1, r2) {
        return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    function resolveCollision(entity, dx, dy) {
        let testX = {x: entity.x + dx, y: entity.y, w: entity.w, h: entity.h};
        let blockedX = false;
        for (let b of blocks) if (rectCollide(testX, b)) { blockedX = true; break; }
        if (!blockedX) entity.x += dx;
        let testY = {x: entity.x, y: entity.y + dy, w: entity.w, h: entity.h};
        let blockedY = false;
        for (let b of blocks) if (rectCollide(testY, b)) { blockedY = true; break; }
        if (!blockedY) entity.y += dy;
    }

    function bulletCollidesWithBlocks(bullet) {
        for (let b of blocks) if (rectCollide(bullet, b)) return true;
        return false;
    }

    document.addEventListener('keydown', (e) => {
        if (e.key.startsWith('Arrow') || e.key === ' ' || e.key === 'Space' || e.key === '0' || e.key === 'Enter') e.preventDefault();
        keys[e.key] = true;
        if (e.key === '0' && gameMode === 2 && gameActive && !isPaused) shoot(player2, WEAPONS[p2WeaponId]);
        if (e.key === 'Escape' && gameActive) togglePause();
        if (e.key === 'z' || e.key === 'Z') {
            if (document.fullscreenElement) {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.();
            }
        }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key.startsWith('Arrow') || e.key === ' ' || e.key === 'Space' || e.key === '0' || e.key === 'Enter') e.preventDefault();
        keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && gameActive && !isPaused) { isMouseDown = true; shoot(player1, WEAPONS[p1WeaponId]); }
    });
    canvas.addEventListener('mouseup', (e) => {
        if (e.button === 0) isMouseDown = false;
    });
    canvas.addEventListener('mouseleave', () => { isMouseDown = false; });

    function togglePause() {
        if (!gameActive) return;
        isPaused = !isPaused;
        pauseScreen.style.display = isPaused ? 'flex' : 'none';
    }

    function shoot(player, weapon) {
        if (!gameActive || isPaused) return;
        const weaponFireDelay = weapon.fireRate || 1.0;
        const currentCooldown = BASE_FIRE_COOLDOWN * weaponFireDelay;
        const now = Date.now();
        if (now - player.lastShot < currentCooldown) return;

        player.lastShot = now;

        let dx, dy;
        const centerX = player.x + player.w / 2;
        const centerY = player.y + player.h / 2;

        if (player === player1) {
            let diffX = mouseX - centerX, diffY = mouseY - centerY;
            let len = Math.sqrt(diffX * diffX + diffY * diffY);
            if (len < 1) { dx = 0; dy = -1; }
            else { dx = diffX / len; dy = diffY / len; }
        } else {
            let targetX = player1.x + player1.w / 2;
            let targetY = player1.y + player1.h / 2;
            let diffX = targetX - centerX, diffY = targetY - centerY;
            let len = Math.sqrt(diffX * diffX + diffY * diffY);
            if (len < 1) { dx = 0; dy = -1; }
            else { dx = diffX / len; dy = diffY / len; }
        }

        const bulletDamage = weapon.damage || 1;
        let finalDamage = bulletDamage;
        if (player === player2 && selectedDifficulty === 'impossible') finalDamage = 5;

        const bulletColor = weapon.color || '#ffaa44';
        const bulletSize = weapon.size || 6;
        const bulletSpeedMult = weapon.speed || 1.0;
        const bulletCount = weapon.bulletCount || 1;
        const spread = weapon.spread || 0;

        addParticles(centerX + dx * (player.w/2 + 5), centerY + dy * (player.h/2 + 5), bulletColor, 8);

        for (let i = 0; i < bulletCount; i++) {
            let bulletDx = dx, bulletDy = dy;
            if (bulletCount > 1) {
                let angle = Math.atan2(dy, dx);
                let spreadAngle = angle + (Math.random() - 0.5) * spread * 2;
                bulletDx = Math.cos(spreadAngle);
                bulletDy = Math.sin(spreadAngle);
            }
            bullets.push({
                x: centerX - bulletSize / 2, y: centerY - bulletSize / 2,
                w: bulletSize, h: bulletSize,
                dx: bulletDx, dy: bulletDy,
                owner: player === player1 ? 'p1' : 'p2',
                speed: bulletSpeed * bulletSpeedMult,
                damage: finalDamage,
                color: bulletColor
            });
        }
    }

    function update(deltaTime) {
        if (!gameActive || isPaused) return;

        particles = particles.filter(p => {
            p.x += p.vx; p.y += p.vy; p.life--;
            p.vx *= p.decay; p.vy *= p.decay;
            return p.life > 0;
        });

        let dx1 = 0, dy1 = 0;
        if (keys['w'] || keys['W'] || keys['ц'] || keys['Ц']) dy1 = -1;
        if (keys['s'] || keys['S'] || keys['ы'] || keys['Ы']) dy1 = 1;
        if (keys['a'] || keys['A'] || keys['ф'] || keys['Ф']) dx1 = -1;
        if (keys['d'] || keys['D'] || keys['в'] || keys['В']) dx1 = 1;
        if (dx1 !== 0 || dy1 !== 0) {
            player1.direction = { dx: dx1, dy: dy1 };
            let len = Math.sqrt(dx1*dx1 + dy1*dy1);
            let speedX = (dx1 / len) * playerSpeed;
            let speedY = (dy1 / len) * playerSpeed;
            resolveCollision(player1, speedX, speedY);
        }

        if (gameMode === 2) {
            let dx2 = 0, dy2 = 0;
            if (keys['ArrowUp']) dy2 = -1;
            if (keys['ArrowDown']) dy2 = 1;
            if (keys['ArrowLeft']) dx2 = -1;
            if (keys['ArrowRight']) dx2 = 1;
            if (dx2 !== 0 || dy2 !== 0) {
                player2.direction = { dx: dx2, dy: dy2 };
                let len = Math.sqrt(dx2*dx2 + dy2*dy2);
                let speedX = (dx2 / len) * playerSpeed;
                let speedY = (dy2 / len) * playerSpeed;
                resolveCollision(player2, speedX, speedY);
            }
        } else {
            const targetX = player1.x + player1.w / 2;
            const targetY = player1.y + player1.h / 2;
            const botCX = player2.x + player2.w / 2, botCY = player2.y + player2.h / 2;
            const dx = targetX - botCX, dy = targetY - botCY;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 1) {
                const normX = dx / dist, normY = dy / dist;
                let moveX = normX, moveY = normY;

                if (Math.random() < 0.2) {
                    let angle = Math.atan2(normY, normX) + (Math.random() - 0.5) * 0.8;
                    moveX = Math.cos(angle);
                    moveY = Math.sin(angle);
                }

                if (dist > 100) {
                    let speedX = moveX * playerSpeed * botSpeedModifier;
                    let speedY = moveY * playerSpeed * botSpeedModifier;
                    resolveCollision(player2, speedX, speedY);
                    player2.direction = { dx: moveX, dy: moveY };
                } else if (dist > 30) {
                    let perpX = -moveY, perpY = moveX;
                    let speedX = perpX * playerSpeed * botSpeedModifier * 0.7;
                    let speedY = perpY * playerSpeed * botSpeedModifier * 0.7;
                    resolveCollision(player2, speedX, speedY);
                    player2.direction = { dx: moveX, dy: moveY };
                }

                if (dist < 450 && dist > 30 && (Date.now() - player2.lastShot > botFireCooldown + Math.random() * 300)) {
                    shoot(player2, WEAPONS[p2WeaponId]);
                }
            }
        }

        player1.x = Math.max(0, Math.min(canvas.width - player1.w, player1.x));
        player1.y = Math.max(0, Math.min(canvas.height - player1.h, player1.y));
        player2.x = Math.max(0, Math.min(canvas.width - player2.w, player2.x));
        player2.y = Math.max(0, Math.min(canvas.height - player2.h, player2.y));

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.dx * b.speed;
            b.y += b.dy * b.speed;
            if (b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) { bullets.splice(i, 1); continue; }
            if (bulletCollidesWithBlocks(b)) { bullets.splice(i, 1); continue; }
            let hit = false;
            if (b.owner === 'p2' && rectCollide(b, player1)) {
                player1.hp -= b.damage;
                player1.lastDamageTime = Date.now();
                player1.regenActive = false;
                hit = true;
                addParticles(b.x + b.w/2, b.y + b.h/2, '#ff5555', 25);
                updateUI();
                if (player1.hp <= 0) { endGame('Игрок Красный победил!'); return; }
            }
            if (b.owner === 'p1' && rectCollide(b, player2)) {
                player2.hp -= b.damage;
                player2.lastDamageTime = Date.now();
                player2.regenActive = false;
                hit = true;
                addParticles(b.x + b.w/2, b.y + b.h/2, '#4169E1', 25);
                updateUI();
                if (player2.hp <= 0) { endGame('Игрок Синий победил!'); return; }
            }
            if (hit) bullets.splice(i, 1);
        }

        const regenDelay = 5000;
        const regenInterval = 2000;
        const regenPercent = 0.1;
        [player1, player2].forEach(p => {
            if (p.hp > 0 && p.hp < p.maxHp) {
                if (!p.regenActive && Date.now() - p.lastDamageTime > regenDelay) {
                    p.regenActive = true;
                    p.lastRegenTime = Date.now();
                }
                if (p.regenActive && Date.now() - p.lastRegenTime >= regenInterval) {
                    p.hp = Math.min(p.maxHp, p.hp + p.maxHp * regenPercent);
                    p.lastRegenTime = Date.now();
                    updateUI();
                    if (p.hp >= p.maxHp) p.regenActive = false;
                }
            } else p.regenActive = false;
        });

        if (isMouseDown && gameActive && !isPaused) {
            const now = Date.now();
            const weapon = WEAPONS[p1WeaponId];
            const weaponFireDelay = weapon.fireRate || 1.0;
            const currentCooldown = BASE_FIRE_COOLDOWN * weaponFireDelay;
            if (now - player1.lastShot >= currentCooldown) shoot(player1, weapon);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, canvas.width/2);
        gradient.addColorStop(0, '#1a1f3d');
        gradient.addColorStop(1, '#0a0f1e');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(65, 105, 225, 0.05)';
        ctx.lineWidth = 1;
        const gridSize = 40;
        for (let x = 0; x <= canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
        for (let y = 0; y <= canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

        ctx.fillStyle = 'rgba(26, 22, 18, 0.7)';
        ctx.strokeStyle = 'rgba(58, 45, 36, 0.5)';
        ctx.lineWidth = 1;
        blocks.forEach(b => { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); });

        if (player1.x !== undefined && mouseX !== undefined) {
            const cx = player1.x + player1.w / 2;
            const cy = player1.y + player1.h / 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(mouseX, mouseY);
            ctx.strokeStyle = 'rgba(65, 105, 225, 0.2)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        particles.forEach(p => {
            const alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        bullets.forEach(b => {
            ctx.fillStyle = b.color || '#ffaa44';
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 12;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.shadowBlur = 0;
        });

        drawPlayer(ctx, player1, SKINS[p1SkinId], true, p1HatId, WEAPONS[p1WeaponId]);
        drawPlayer(ctx, player2, SKINS[p2SkinId], false, 0, WEAPONS[p2WeaponId]);
    }

    function drawPlayer(ctx, player, skin, isP1, hatId, weapon) {
        const x = player.x + player.w / 2;
        const y = player.y + player.h / 2;
        const r = player.w / 2;

        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = skin.primary;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = skin.secondary;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = skin.secondary;
        ctx.fill();

        let dirX = player.direction.dx;
        let dirY = player.direction.dy;
        if (isP1) {
            let dX = mouseX - x, dY = mouseY - y;
            let len = Math.sqrt(dX*dX + dY*dY);
            if (len > 1) { dirX = dX / len; dirY = dY / len; }
            else if (len === 0) { dirX = 0; dirY = -1; }
        } else {
            if (dirX === 0 && dirY === 0) { dirX = 0; dirY = -1; }
        }

        let eyeOffX = dirX * 5, eyeOffY = dirY * 5;
        let perpX = -dirY, perpY = dirX;

        function drawEye(ox, oy) {
            let ex = x + eyeOffX + ox, ey = y + eyeOffY + oy;
            ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI*2); ctx.fillStyle = skin.eye; ctx.fill();
            ctx.beginPath(); ctx.arc(ex + dirX*2.5, ey + dirY*2.5, 2, 0, Math.PI*2); ctx.fillStyle = skin.pupil; ctx.fill();
        }
        drawEye(perpX * 5, perpY * 5);
        drawEye(-perpX * 5, -perpY * 5);

        ctx.beginPath();
        ctx.arc(x + dirX*5, y + dirY*8 + 4, 3, 0, Math.PI);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (isP1 && hatId !== undefined && HATS[hatId] && HATS[hatId].name !== 'Без шляпы') {
            const hat = HATS[hatId];
            const hatY = y - r - 5;
            ctx.fillStyle = hat.primary;
            ctx.strokeStyle = hat.secondary;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - 12, hatY);
            ctx.lineTo(x, hatY - 18);
            ctx.lineTo(x + 12, hatY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = hat.secondary;
            ctx.fillRect(x - 15, hatY - 2, 30, 4);
        }

        if (weapon) {
            const weaponX = x + dirX * (r + 2);
            const weaponY = y + dirY * (r + 2);
            ctx.shadowColor = weapon.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(x + dirX * (r - 4), y + dirY * (r - 4));
            ctx.lineTo(weaponX, weaponY);
            ctx.strokeStyle = weapon.color;
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(weaponX, weaponY, 3, 0, Math.PI * 2);
            ctx.fillStyle = weapon.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function updateUI() {
        hp1Bar.style.width = (player1.hp / player1.maxHp * 100) + '%';
        hp2Bar.style.width = (player2.hp / player2.maxHp * 100) + '%';
    }

    function endGame(winnerMessage) {
        gameActive = false;
        isPaused = false;
        pauseScreen.style.display = 'none';
        winnerText.textContent = winnerMessage;
        winnerSubtext.textContent = "В метели выживает сильнейший.";
        gameOverScreen.style.display = 'flex';
        if (gameMode === 1 && player2.hp <= 0) {
            let reward = 0;
            switch(selectedDifficulty) {
                case 'easy': reward = 20; break;
                case 'medium': reward = 50; break;
                case 'hard': reward = 100; break;
                case 'impossible': reward = 200; break;
            }
            const mult = getCoinMultiplier();
            coins += reward * mult;
            updateCoinsDisplay();
        }
    }

    function resetGameState() {
        blocks = MAPS[selectedMap].blocks.map(b => ({...b}));
        player1.hp = MAX_HP; player1.maxHp = MAX_HP; player1.lastDamageTime = Date.now(); player1.regenActive = false; player1.lastRegenTime = 0;
        if (gameMode === 1) { player2.hp = botHP; player2.maxHp = botHP; } else { player2.hp = MAX_HP; player2.maxHp = MAX_HP; }
        player2.lastDamageTime = Date.now(); player2.regenActive = false; player2.lastRegenTime = 0;
        player1.color = SKINS[p1SkinId].primary;
        p2SkinId = Math.floor(Math.random() * SKINS.length);
        while (p2SkinId === p1SkinId && SKINS.length > 1) p2SkinId = Math.floor(Math.random() * SKINS.length);
        player2.color = SKINS[p2SkinId].primary;
        p2WeaponId = Math.floor(Math.random() * WEAPONS.length);

        let startX1 = 100, startY1 = 250;
        let startX2 = 770, startY2 = 250;
        while (pointCollidesWithBlocks(startX1, startY1, PLAYER_SIZE)) { startX1 += 10; if (startX1 > canvas.width - PLAYER_SIZE) startX1 = 10; }
        while (pointCollidesWithBlocks(startX2, startY2, PLAYER_SIZE)) { startX2 -= 10; if (startX2 < 0) startX2 = canvas.width - PLAYER_SIZE - 10; }
        player1.x = startX1; player1.y = startY1;
        player2.x = startX2; player2.y = startY2;
        player1.direction = { dx: 0, dy: -1 };
        player2.direction = { dx: 0, dy: -1 };
        player1.lastShot = 0; player2.lastShot = 0;
        bullets = []; particles = [];
        gameActive = true;
        isPaused = false;
        pauseScreen.style.display = 'none';
        updateUI();
    }

    function launchGame() {
        gameActive = false;
        isPaused = false;
        pauseScreen.style.display = 'none';
        bullets = []; particles = [];
        menuScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        applyDifficulty(selectedDifficulty);
        if (gameMode === 1) uiHint.textContent = "Наведи мышь и стреляй ЛКМ!";
        else uiHint.textContent = "Синий: ЛКМ по курсору. Красный: 0.";
        resetGameState();
        setTimeout(() => { gameActive = true; }, 100);
        accumulator = 0;
        lastTimestamp = performance.now();
    }

    function applyDifficulty(difficulty) {
        if (difficulty === 'easy') { bulletSpeed = 10; botSpeedModifier = 0.6; botFireCooldown = 200; botHP = 60; }
        else if (difficulty === 'medium') { bulletSpeed = 12; botSpeedModifier = 0.8; botFireCooldown = 160; botHP = 80; }
        else if (difficulty === 'hard') { bulletSpeed = 16; botSpeedModifier = 0.9; botFireCooldown = 120; botHP = 100; }
        else if (difficulty === 'impossible') { bulletSpeed = 20; botSpeedModifier = 1.0; botFireCooldown = 80; botHP = 150; }
    }

    function backToMenu() {
        gameActive = false;
        isPaused = false;
        pauseScreen.style.display = 'none';
        gameMode = null;
        selectedDifficulty = 'medium';
        selectedMap = 0;
        botHP = 40;
        botSpeedModifier = 0.85;
        botFireCooldown = 150;
        player1.hp = MAX_HP; player2.hp = MAX_HP;
        player1.x = 100; player1.y = 250;
        player2.x = 770; player2.y = 250;
        player1.direction = { dx: 0, dy: -1 };
        player2.direction = { dx: 0, dy: -1 };
        updateUI();
        gameOverScreen.style.display = 'none';
        menuScreen.style.display = 'flex';
        modeSelect.style.display = 'flex';
        difficultySelect.style.display = 'none';
        mapSelect.style.display = 'none';
        storeScreen.style.display = 'none';
        accumulator = 0;
        lastTimestamp = performance.now();
        promoToggleBtn.style.display = 'block';
        promoPanel.style.display = 'none';
        promoStatus.textContent = '';
        promoStatus.className = '';
    }

    // ========== ОСНОВНОЙ ЦИКЛ С ФИКСИРОВАННЫМ ШАГОМ (60 FPS) ==========
    function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const delta = timestamp - lastTimestamp;
        lastTimestamp = timestamp;

        if (gameActive && !isPaused) {
            accumulator += delta;
            while (accumulator >= STEP) {
                update(STEP);
                accumulator -= STEP;
                if (!gameActive) break;
            }
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
